name: Build DAF XF Android APK

on:
  push:
    branches:
      - daf-xf-android-build-20260925
    paths:
      - ".github/workflows/daf-xf-apk.yml"
      - "daf-xf-build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/daf-build
          cat daf-xf-build/chunks/chunk-*.txt | tr -d '\n\r' | base64 -d > /tmp/daf-build/project.zip
          echo "333d114548c7e82f5138d1c34cddc6fcbf8e1144655d162e8383201416aa54eb  /tmp/daf-build/project.zip" | sha256sum -c -
          unzip -q /tmp/daf-build/project.zip -d /tmp/daf-build
          test -f /tmp/daf-build/DAF_XF_Android_App_Project_compact/settings.gradle.kts
          echo "PROJECT_DIR=/tmp/daf-build/DAF_XF_Android_App_Project_compact" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; using preinstalled SDK packages"
            ls -la "$ANDROID_HOME/platforms" || true
            ls -la "$ANDROID_HOME/build-tools" || true
          else
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" /tmp/DAF-XF-Manual-v1.0.0.apk
          ls -lh /tmp/DAF-XF-Manual-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAF-XF-Manual-APK
          path: /tmp/DAF-XF-Manual-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
